# One grouped pull request per ecosystem and week: the weekly batch, majors included.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: chore
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
    ignore:
      # Tied to the version htmd uses: bump it together with htmd.
      - dependency-name: markup5ever_rcdom
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # v1 changes how existing releases are updated: check it against release-please's notes first.
      - dependency-name: tauri-apps/tauri-action
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci
