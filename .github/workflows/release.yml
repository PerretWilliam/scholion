name: Release

# Push a tag like v0.1.0 (matching the version in tauri.conf.json) to build installers for every
# platform into a draft GitHub release. Review the draft, then publish it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.llama }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            llama: darwin-arm64
            args: --target aarch64-apple-darwin
          - os: macos-latest
            llama: darwin-x64
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            llama: linux-x64
            args: ""
          - os: windows-latest
            llama: win32-x64
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The llama-server build for the target platform, not the runner's.
      - run: pnpm fetch:llama ${{ matrix.llama }}

      - run: rustup toolchain install
      - if: matrix.llama == 'darwin-x64'
        run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds are unsigned: see docs/architecture.md, "Releases".
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ai-doc ${{ github.ref_name }}
          releaseBody: See the assets below to download and install ai-doc.
          releaseDraft: true
          args: ${{ matrix.args }}
