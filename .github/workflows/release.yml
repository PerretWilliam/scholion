name: Release

# Conventional Commits on main drive the version. release-please keeps a "release PR" open that
# bumps package.json, tauri.conf.json and Cargo.toml and writes CHANGELOG.md. Merging it tags the
# release, then the installers for every platform are built and attached to it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.llama }})
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            llama: darwin-arm64
            args: --target aarch64-apple-darwin
          - os: macos-latest
            llama: darwin-x64
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            llama: linux-x64
            args: ""
          - os: windows-latest
            llama: win32-x64
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The llama-server build for the target platform, not the runner's.
      - run: pnpm fetch:llama ${{ matrix.llama }}

      - run: rustup toolchain install
      - if: matrix.llama == 'darwin-x64'
        run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds are unsigned: see docs/architecture.md, "Releases". The assets are added to the
      # release that release-please just created.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.release-please.outputs.tag }}
          args: ${{ matrix.args }}
