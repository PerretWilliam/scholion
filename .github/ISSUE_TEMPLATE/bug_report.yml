name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scholion version
      description: Shown in the installer name or the release you downloaded.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and documentation
      description: For example "Qwen3.5 4B, Python 3.15", or the cloud provider if you use one.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        For model start-up problems, paste `llama-server.log` from the app data folder
        (macOS: `~/Library/Application Support/com.williamperret.scholion/`).
      render: text
